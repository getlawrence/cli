name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-linux:
    name: Release Linux AMD64
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '~1.24'
          check-latest: true

      - name: Build binary
        run: |
          go build -ldflags="-s -w -X github.com/getlawrence/cli/cmd.Version=${{ github.ref_name }} -X github.com/getlawrence/cli/cmd.GitCommit=${{ github.sha }} -X github.com/getlawrence/cli/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o lawrence-linux-amd64 .

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/lawrence_${{ github.ref_name }}_linux_amd64.tar.gz lawrence-linux-amd64 LICENSE README.md

      - name: Generate knowledge database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generating knowledge database for release..."
          
          # First, sync the registry to get latest data
          go run . registry sync
          
          # Generate the knowledge database with GitHub token for better API access
          go run . knowledge update --output data/knowledge.db --force --token $GITHUB_TOKEN
          
          # Verify the database was created
          if [ ! -f "data/knowledge.db" ]; then
            echo "Error: Knowledge database was not generated"
            exit 1
          fi
          
          echo "Knowledge database generated successfully"
          ls -la data/knowledge.db

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-amd64
          path: dist/
          if-no-files-found: error

  release-windows:
    name: Release Windows AMD64
    runs-on: windows-latest
    permissions:
      packages: write
    env:
      GOOS: windows
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '~1.24'
          check-latest: true

      - name: Build binary
        run: |
          go build -ldflags="-s -w -X github.com/getlawrence/cli/cmd.Version=${{ github.ref_name }} -X github.com/getlawrence/cli/cmd.GitCommit=${{ github.sha }} -X github.com/getlawrence/cli/cmd.BuildDate=$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')" -o lawrence-windows-amd64.exe .

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/lawrence_${{ github.ref_name }}_windows_amd64.tar.gz lawrence-windows-amd64.exe LICENSE README.md

      - name: Generate knowledge database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generating knowledge database for release..."
          
          # First, sync the registry to get latest data
          go run . registry sync
          
          # Generate the knowledge database with GitHub token for better API access
          go run . knowledge update --output data/knowledge.db --force --token $env:GITHUB_TOKEN
          
          # Verify the database was created
          if (-not (Test-Path "data/knowledge.db")) {
            echo "Error: Knowledge database was not generated"
            exit 1
          }
          
          echo "Knowledge database generated successfully"
          Get-ChildItem "data/knowledge.db" | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows-amd64
          path: dist/
          if-no-files-found: error

  release-macos-amd64:
    name: Release macOS AMD64
    runs-on: macos-latest
    permissions:
      packages: write
    env:
      GOOS: darwin
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '~1.24'
          check-latest: true

      - name: Build binary
        run: |
          go build -ldflags="-s -w -X github.com/getlawrence/cli/cmd.Version=${{ github.ref_name }} -X github.com/getlawrence/cli/cmd.GitCommit=${{ github.sha }} -X github.com/getlawrence/cli/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o lawrence-darwin-amd64 .

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/lawrence_${{ github.ref_name }}_darwin_amd64.tar.gz lawrence-darwin-amd64 LICENSE README.md

      - name: Generate knowledge database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generating knowledge database for release..."
          
          # First, sync the registry to get latest data
          go run . registry sync
          
          # Generate the knowledge database with GitHub token for better API access
          go run . knowledge update --output data/knowledge.db --force --token $GITHUB_TOKEN
          
          # Verify the database was created
          if [ ! -f "data/knowledge.db" ]; then
            echo "Error: Knowledge database was not generated"
            exit 1
          fi
          
          echo "Knowledge database generated successfully"
          ls -la data/knowledge.db

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-darwin-amd64
          path: dist/
          if-no-files-found: error

  release-macos-arm64:
    name: Release macOS ARM64
    runs-on: macos-latest
    permissions:
      packages: write
    env:
      GOOS: darwin
      GOARCH: arm64
      GOAMD64: v1
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '~1.24'
          check-latest: true

      - name: Build binary
        run: |
          go build -ldflags="-s -w -X github.com/getlawrence/cli/cmd.Version=${{ github.ref_name }} -X github.com/getlawrence/cli/cmd.GitCommit=${{ github.sha }} -X github.com/getlawrence/cli/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o lawrence-darwin-arm64 .

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/lawrence_${{ github.ref_name }}_darwin_arm64.tar.gz lawrence-darwin-arm64 LICENSE README.md

      - name: Generate knowledge database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generating knowledge database for release..."
          
          # First, sync the registry to get latest data
          go run . registry sync
          
          # Generate the knowledge database with GitHub token for better API access
          go run . knowledge update --output data/knowledge.db --force --token $GITHUB_TOKEN
          
          # Verify the database was created
          if [ ! -f "data/knowledge.db" ]; then
            echo "Error: Knowledge database was not generated"
            exit 1
          fi
          
          echo "Knowledge database generated successfully"
          ls -la data/knowledge.db

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-darwin-arm64
          path: dist/
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-linux
      - release-windows
      - release-macos-amd64
      - release-macos-arm64
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '~1.24'
          check-latest: true

      - name: Get previous tag
        id: prev-tag
        run: |
          prev_tag=$(git tag | sort -r --version-sort | head -n 2 | tail -n 1)
          echo "PREVIOUS_RELEASE_TAG=$prev_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist/
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R dist/

      - name: Create checksums
        run: |
          cd dist
          find . -name "*.tar.gz" -exec shasum -a 256 {} \; > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lawrence CLI ${{ github.ref_name }}
          body: |
            ## Lawrence CLI ${{ github.ref_name }}
            
            ### Downloads
            
            **Linux AMD64:**
            - [lawrence_${{ github.ref_name }}_linux_amd64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lawrence_${{ github.ref_name }}_linux_amd64.tar.gz)
            
            **Windows AMD64:**
            - [lawrence_${{ github.ref_name }}_windows_amd64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lawrence_${{ github.ref_name }}_windows_amd64.tar.gz)
            
            **macOS AMD64:**
            - [lawrence_${{ github.ref_name }}_darwin_amd64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lawrence_${{ github.ref_name }}_darwin_amd64.tar.gz)
            
            **macOS ARM64:**
            - [lawrence_${{ github.ref_name }}_darwin_arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/lawrence_${{ github.ref_name }}_darwin_arm64.tar.gz)
            
            ### Checksums
            
            ```
            $(cat dist/checksums.txt)
            ```
            
            ### Changes since ${{ steps.prev-tag.outputs.PREVIOUS_RELEASE_TAG }}
            
            $(git log --oneline ${{ steps.prev-tag.outputs.PREVIOUS_RELEASE_TAG }}..HEAD)
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


